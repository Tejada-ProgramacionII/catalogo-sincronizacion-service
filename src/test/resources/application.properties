spring.application.name=catalogo-sincronizacion-service

# Base en memoria SOLO para tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Los tests usan las mismas migraciones que la base real
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Valores ficticios: los tests nunca llaman a la cátedra
catedra.base-url=http://catedra.test
catedra.jwt=jwt-de-prueba
catedra.redis.host=redis.test
catedra.redis.username=usuario-de-prueba
catedra.redis.password=clave-de-prueba
spring.data.redis.repositories.enabled=false
catedra.kafka.bootstrap-servers=kafka.test:9092
catedra.kafka.topic-catalogo=catedra.catalog.test
catedra.kafka.grupo=grupo-de-prueba
# Los tests nunca se conectan a Kafka: el consumidor no arranca
spring.kafka.listener.auto-startup=false

# Sin espera entre reintentos para que los tests no duerman
catedra.sincronizacion.espera-entre-intentos=0s

# Ningún test sincroniza al arrancar: no se llama a la cátedra
catedra.sincronizacion.al-arrancar=false
catedra.sincronizacion.verificacion-periodica=false

# Secreto JWT SOLO para los tests (texto de prueba en Base64, no es una clave real)
