spring.application.name=catalogo-sincronizacion-service

# PostgreSQL (los valores se pueden sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo}
spring.datasource.username=${DB_USERNAME:catalogo}
spring.datasource.password=${DB_PASSWORD:catalogo}

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Los errores de Spring MVC (un filtro con formato inválido, por ejemplo) salen como
# application/problem+json e indican qué parámetro falló, igual que los nuestros.
spring.mvc.problemdetails.enabled=true

# Integración con la cátedra: la URL y el JWT técnico no van al repositorio.
# Sin estas variables de entorno el servicio no arranca.
catedra.base-url=${CATEDRA_BASE_URL:}
catedra.jwt=${CATEDRA_JWT:}

# Verificación periódica contra la versión publicada en Redis (D-07).
catedra.sincronizacion.intervalo-verificacion=5m

# Redis de la cátedra (solo lectura en catedra:sync:*): el usuario y la clave no van al repositorio.
# Sin host, usuario o clave el servicio no arranca.
catedra.redis.host=${CATEDRA_REDIS_HOST:}
catedra.redis.port=${CATEDRA_REDIS_PORT:6379}
catedra.redis.username=${CATEDRA_REDIS_USERNAME:}
catedra.redis.password=${CATEDRA_REDIS_PASSWORD:}
# Redis solo se usa como cliente: no hay repositorios de Spring Data Redis.
spring.data.redis.repositories.enabled=false

# JWT de usuario: lo emite turnos-reservas-service con HS512. El secreto (Base64, al menos
# 64 bytes) es el mismo que en turnos y llega solo por la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET}
