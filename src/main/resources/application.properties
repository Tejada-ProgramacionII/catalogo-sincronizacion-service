spring.application.name=catalogo-sincronizacion-service

# PostgreSQL (los valores se pueden sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo}
spring.datasource.username=${DB_USERNAME:catalogo}
spring.datasource.password=${DB_PASSWORD:catalogo}

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Integración con la cátedra: la URL y el JWT técnico no van al repositorio.
# Sin estas variables de entorno el servicio no arranca.
catedra.base-url=${CATEDRA_BASE_URL:}
catedra.jwt=${CATEDRA_JWT:}
