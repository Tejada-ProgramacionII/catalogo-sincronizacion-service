# Base de datos propia del servicio de catálogo para desarrollo local.
# Los valores por defecto coinciden con application.properties y se pueden
# sobrescribir con variables de entorno (DB_NAME, DB_USERNAME, DB_PASSWORD, DB_PORT).
services:
  catalogo-db:
    image: postgres:17
    container_name: catalogo-db
    environment:
      POSTGRES_DB: ${DB_NAME:-catalogo}
      POSTGRES_USER: ${DB_USERNAME:-catalogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalogo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - catalogo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catalogo-db-data:
